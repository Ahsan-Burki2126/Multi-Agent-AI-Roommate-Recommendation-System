<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — RoomMate AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/design-system.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #0B1020; }
        .auth-card {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .btn-primary {
            background: linear-gradient(135deg, #4F46E5, #06B6D4);
            transition: all 0.3s;
        }
        .btn-primary:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
            box-shadow: 0 8px 32px rgba(79,70,229,0.4);
        }
        .input-field {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            color: #E5E7EB;
            transition: all 0.2s;
        }
        .input-field:focus {
            outline: none;
            border-color: #4F46E5;
            background: rgba(79,70,229,0.08);
            box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
        }
        .input-field::placeholder { color: #4B5563; }
        select.input-field option { background: #1a1f35; color: #E5E7EB; }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .blob { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; }
    </style>
</head>
<body class="min-h-screen text-white relative overflow-hidden" style="background:#0B1020; font-family:'Inter',sans-serif;">

    <!-- Ambient background -->
    <div class="blob" style="width:500px;height:500px;background:rgba(79,70,229,0.12);top:-150px;left:-150px;animation:float 10s ease-in-out infinite;"></div>
    <div class="blob" style="width:400px;height:400px;background:rgba(6,182,212,0.08);bottom:-100px;right:-100px;animation:float 8s ease-in-out infinite;animation-delay:-4s;"></div>
    <div class="blob" style="width:300px;height:300px;background:rgba(79,70,229,0.07);top:50%;left:33%;animation:float 12s ease-in-out infinite;animation-delay:-2s;"></div>

    <div class="min-h-screen flex flex-col relative z-10">
        <!-- Header -->
        <header class="py-6 px-8">
            <a href="/" class="flex items-center space-x-3 w-fit">
                <div class="w-9 h-9 rounded-xl flex items-center justify-center text-lg" style="background:linear-gradient(135deg,#4F46E5,#06B6D4);">🏠</div>
                <span class="text-lg font-bold gradient-text">RoomMate AI</span>
            </a>
        </header>

        <!-- Main -->
        <main class="flex-1 flex items-center justify-center py-12 px-4">
            <div class="w-full max-w-lg">

                <!-- Badge -->
                <div class="text-center mb-8">
                    <span class="ai-badge">AI-Powered Matching</span>
                    <h1 class="text-4xl font-bold mt-4 mb-2 text-white">Create Your Account</h1>
                    <p style="color:#9CA3AF;">Start finding your perfect roommate today</p>
                </div>

                <!-- Card -->
                <div class="auth-card rounded-2xl p-8">
                    <!-- Error Message -->
                    <div id="errorMessage" class="hidden mb-5 p-4 rounded-xl text-sm" style="background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.25);color:#F87171;"></div>

                    <!-- Success Message -->
                    <div id="successMessage" class="hidden mb-5 p-4 rounded-xl text-sm" style="background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.25);color:#4ADE80;"></div>

                    <!-- Form -->
                    <form id="registerForm" class="space-y-5">

                        <!-- Full Name -->
                        <div>
                            <label class="block text-sm font-medium mb-2" style="color:#D1D5DB;">Full Name</label>
                            <div class="relative">
                                <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5" style="color:#4B5563;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                                <input type="text" id="fullName" name="fullName" required placeholder="John Doe"
                                    class="input-field w-full pl-11 pr-4 py-3 rounded-xl text-sm">
                            </div>
                        </div>

                        <!-- Email -->
                        <div>
                            <label class="block text-sm font-medium mb-2" style="color:#D1D5DB;">Email Address</label>
                            <div class="relative">
                                <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5" style="color:#4B5563;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/></svg>
                                <input type="email" id="email" name="email" required placeholder="you@university.edu"
                                    class="input-field w-full pl-11 pr-4 py-3 rounded-xl text-sm">
                            </div>
                        </div>

                        <!-- Gender -->
                        <div>
                            <label class="block text-sm font-medium mb-2" style="color:#D1D5DB;">Gender</label>
                            <select id="gender" name="gender" required
                                class="input-field w-full px-4 py-3 rounded-xl text-sm">
                                <option value="">Select gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                                <option value="Prefer not to say">Prefer not to say</option>
                            </select>
                        </div>

                        <!-- City -->
                        <div>
                            <label class="block text-sm font-medium mb-2" style="color:#D1D5DB;">
                                City <span style="color:#6B7280;">(optional)</span>
                            </label>
                            <div class="relative">
                                <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5" style="color:#4B5563;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                                <input type="text" id="city" name="city" placeholder="Bahawalpur"
                                    class="input-field w-full pl-11 pr-4 py-3 rounded-xl text-sm">
                            </div>
                        </div>

                        <!-- Password -->
                        <div>
                            <label class="block text-sm font-medium mb-2" style="color:#D1D5DB;">Password</label>
                            <div class="relative">
                                <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5" style="color:#4B5563;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                                <input type="password" id="password" name="password" required minlength="8" placeholder="••••••••"
                                    class="input-field w-full pl-11 pr-12 py-3 rounded-xl text-sm">
                                <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2" style="color:#6B7280;">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                                </button>
                            </div>
                            <p class="mt-1.5 text-xs" style="color:#6B7280;">At least 8 characters</p>
                        </div>

                        <!-- Confirm Password -->
                        <div>
                            <label class="block text-sm font-medium mb-2" style="color:#D1D5DB;">Confirm Password</label>
                            <div class="relative">
                                <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5" style="color:#4B5563;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="••••••••"
                                    class="input-field w-full pl-11 pr-4 py-3 rounded-xl text-sm">
                            </div>
                        </div>

                        <!-- Terms -->
                        <div class="flex items-start gap-3">
                            <input type="checkbox" id="terms" required
                                class="mt-0.5 w-4 h-4 rounded flex-shrink-0" style="accent-color:#4F46E5;">
                            <label for="terms" class="text-sm" style="color:#9CA3AF;">
                                I agree to the
                                <a href="#" class="font-medium" style="color:#818CF8;">Terms of Service</a>
                                and
                                <a href="#" class="font-medium" style="color:#818CF8;">Privacy Policy</a>
                            </label>
                        </div>

                        <!-- Submit -->
                        <button type="submit" id="submitBtn"
                            class="btn-primary w-full py-3.5 rounded-xl font-semibold text-white disabled:opacity-50 disabled:cursor-not-allowed">
                            <span id="btnText">Create Account</span>
                            <span id="btnLoader" class="hidden flex items-center justify-center gap-2">
                                <svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                Creating account...
                            </span>
                        </button>
                    </form>

                    <!-- Divider -->
                    <div class="my-6 flex items-center gap-3">
                        <div class="flex-1 h-px" style="background:rgba(255,255,255,0.08);"></div>
                        <span class="text-xs" style="color:#6B7280;">OR</span>
                        <div class="flex-1 h-px" style="background:rgba(255,255,255,0.08);"></div>
                    </div>

                    <!-- Sign in link -->
                    <p class="text-center text-sm" style="color:#9CA3AF;">
                        Already have an account?
                        <a href="/login.html" class="font-semibold ml-1" style="color:#818CF8;">Sign in →</a>
                    </p>
                </div>
            </div>
        </main>

        <footer class="py-6 text-center text-xs" style="color:#4B5563;">© 2026 RoomMate AI — IUB Final Year Project</footer>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordInput = document.getElementById('password');
            const confirmInput = document.getElementById('confirmPassword');
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            confirmInput.type = type;
        });

        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const genderInput = document.getElementById('gender').value;
            const city = document.getElementById('city').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const genderMap = { 'Male': 'M', 'Female': 'F', 'Other': 'Other', 'Prefer not to say': 'Other' };
            const gender = genderMap[genderInput] || genderInput;
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            if (password !== confirmPassword) {
                errorMessage.textContent = 'Passwords do not match';
                errorMessage.classList.remove('hidden');
                return;
            }
            submitBtn.disabled = true;
            btnText.classList.add('hidden');
            btnLoader.classList.remove('hidden');
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');
            try {
                await auth.register(email, password, confirmPassword, fullName, city, gender);
                successMessage.textContent = 'Account created successfully! Redirecting to login...';
                successMessage.classList.remove('hidden');
                setTimeout(() => { window.location.href = '/login.html'; }, 2000);
            } catch (error) {
                errorMessage.textContent = error.message || 'Registration failed. Please try again.';
                errorMessage.classList.remove('hidden');
                submitBtn.disabled = false;
                btnText.classList.remove('hidden');
                btnLoader.classList.add('hidden');
            }
        });

        if (localStorage.getItem('token')) {
            window.location.href = '/dashboard.html';
        }
    </script>
</body>
</html>
