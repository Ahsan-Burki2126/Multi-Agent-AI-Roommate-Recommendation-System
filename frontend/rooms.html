<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rooms - RoomMate Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#7C3AED',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 50%, #EC4899 100%);
        }

        .gradient-text {
            background: linear-gradient(135deg, #4F46E5, #7C3AED, #EC4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-link.active {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.2), rgba(124, 58, 237, 0.2));
            border-left: 3px solid #7C3AED;
        }

        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -12px rgba(79, 70, 229, 0.25);
        }
    </style>
</head>

<body class="bg-gray-900 text-white min-h-screen">
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-800/50 border-r border-gray-700/50 hidden lg:block">
            <div class="p-6">
                <a href="/" class="flex items-center space-x-2">
                    <span class="text-2xl">🏠</span>
                    <span class="text-lg font-bold gradient-text">RoomMate Finder</span>
                </a>
            </div>

            <nav class="mt-6 px-3">
                <a href="/dashboard.html"
                    class="sidebar-link flex items-center px-4 py-3 rounded-lg text-gray-400 hover:text-white hover:bg-gray-700/50 mb-1 transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    Dashboard
                </a>
                <a href="/matches.html"
                    class="sidebar-link flex items-center px-4 py-3 rounded-lg text-gray-400 hover:text-white hover:bg-gray-700/50 mb-1 transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    Matches
                </a>
                <a href="/rooms.html"
                    class="sidebar-link active flex items-center px-4 py-3 rounded-lg text-white mb-1 transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                    </svg>
                    Rooms
                </a>
                <a href="/ai-agents.html"
                    class="sidebar-link flex items-center px-4 py-3 rounded-lg text-gray-400 hover:text-white hover:bg-gray-700/50 mb-1 transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                    AI Agents
                </a>
                <a href="/preferences.html"
                    class="sidebar-link flex items-center px-4 py-3 rounded-lg text-gray-400 hover:text-white hover:bg-gray-700/50 mb-1 transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                    </svg>
                    Preferences
                </a>
                <a href="/profile.html"
                    class="sidebar-link flex items-center px-4 py-3 rounded-lg text-gray-400 hover:text-white hover:bg-gray-700/50 mb-1 transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    Profile
                </a>
                <a href="/settings.html"
                    class="sidebar-link flex items-center px-4 py-3 rounded-lg text-gray-400 hover:text-white hover:bg-gray-700/50 mb-1 transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    Settings
                </a>

                <div class="border-t border-gray-700 my-4"></div>

                <button onclick="handleLogout()"
                    class="sidebar-link flex items-center px-4 py-3 rounded-lg text-gray-400 hover:text-red-400 hover:bg-red-500/10 w-full transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                    Logout
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col">
            <!-- Top Bar -->
            <header class="h-16 bg-gray-800/50 border-b border-gray-700/50 flex items-center justify-between px-6">
                <button id="mobileMenuBtn" class="lg:hidden text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>

                <h1 class="text-xl font-semibold hidden lg:block">Rooms</h1>

                <div class="flex items-center space-x-4">
                    <button onclick="showAddRoomModal()"
                        class="px-4 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 rounded-xl text-sm font-medium transition">
                        + Post Room
                    </button>
                    <div class="w-10 h-10 rounded-full bg-gradient-to-r from-indigo-500 to-purple-500 flex items-center justify-center font-bold"
                        id="userAvatar">U</div>
                </div>
            </header>

            <!-- Page Content -->
            <main class="flex-1 p-6 overflow-auto">
                <div class="max-w-6xl mx-auto">
                    <!-- Tab Navigation -->
                    <div class="flex items-center space-x-4 mb-8">
                        <button onclick="showTab('browse')" id="tab-browse"
                            class="px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-xl font-medium transition">
                            Browse Rooms
                        </button>
                        <button onclick="showTab('my-rooms')" id="tab-my-rooms"
                            class="px-6 py-3 bg-gray-700/50 hover:bg-gray-700 border border-gray-600 rounded-xl font-medium transition">
                            My Listings
                        </button>
                    </div>

                    <!-- Browse Rooms Tab -->
                    <div id="browse-content">
                        <!-- Filters -->
                        <div class="bg-gray-800/50 border border-gray-700/50 rounded-2xl p-4 mb-6">
                            <div class="flex flex-wrap items-center gap-4">
                                <div class="flex-1 min-w-[200px]">
                                    <input type="text" id="searchRooms" placeholder="Search by location or title..."
                                        class="w-full px-4 py-2 bg-gray-700/50 border border-gray-600 rounded-xl focus:border-indigo-500 outline-none transition text-sm">
                                </div>
                                <select id="priceFilter"
                                    class="px-4 py-2 bg-gray-700/50 border border-gray-600 rounded-xl focus:border-indigo-500 outline-none transition text-sm">
                                    <option value="">All Prices</option>
                                    <option value="0-500">Under $500</option>
                                    <option value="500-1000">$500 - $1,000</option>
                                    <option value="1000-1500">$1,000 - $1,500</option>
                                    <option value="1500+">$1,500+</option>
                                </select>
                                <select id="typeFilter"
                                    class="px-4 py-2 bg-gray-700/50 border border-gray-600 rounded-xl focus:border-indigo-500 outline-none transition text-sm">
                                    <option value="">All Types</option>
                                    <option value="single">Single Room</option>
                                    <option value="shared">Shared Room</option>
                                    <option value="master">Master Bedroom</option>
                                </select>
                            </div>
                        </div>

                        <!-- Rooms Grid -->
                        <div id="roomsGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                            <!-- Loading state -->
                            <div class="col-span-full flex items-center justify-center py-12">
                                <div
                                    class="animate-spin w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full">
                                </div>
                            </div>
                        </div>

                        <!-- Empty State -->
                        <div id="emptyRooms" class="hidden text-center py-16">
                            <div
                                class="w-24 h-24 mx-auto bg-gray-700/50 rounded-full flex items-center justify-center text-5xl mb-6">
                                🏠</div>
                            <h3 class="text-2xl font-bold mb-2">No Rooms Available</h3>
                            <p class="text-gray-400 mb-6">Be the first to list a room in your area!</p>
                            <button onclick="showAddRoomModal()"
                                class="inline-flex items-center px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 rounded-xl font-medium transition">
                                + Post Your Room
                            </button>
                        </div>
                    </div>

                    <!-- My Rooms Tab -->
                    <div id="my-rooms-content" class="hidden">
                        <div id="myRoomsGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                            <!-- My rooms will appear here -->
                        </div>

                        <div id="emptyMyRooms" class="hidden text-center py-16">
                            <div
                                class="w-24 h-24 mx-auto bg-gray-700/50 rounded-full flex items-center justify-center text-5xl mb-6">
                                📝</div>
                            <h3 class="text-2xl font-bold mb-2">No Listings Yet</h3>
                            <p class="text-gray-400 mb-6">You haven't posted any rooms yet.</p>
                            <button onclick="showAddRoomModal()"
                                class="inline-flex items-center px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 rounded-xl font-medium transition">
                                + Post Your First Room
                            </button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Add Room Modal -->
    <div id="addRoomModal"
        class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-800 rounded-2xl max-w-lg w-full max-h-[90vh] overflow-auto">
            <div class="p-6">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-xl font-bold">Post a Room</h3>
                    <button onclick="closeAddRoomModal()" class="text-gray-400 hover:text-white">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <form id="addRoomForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Room Title *</label>
                        <input type="text" id="roomTitle" required placeholder="e.g., Cozy private room near downtown"
                            class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600 rounded-xl focus:border-indigo-500 outline-none transition">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Location *</label>
                        <input type="text" id="roomLocation" required placeholder="e.g., Manhattan, NYC"
                            class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600 rounded-xl focus:border-indigo-500 outline-none transition">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Monthly Rent ($) *</label>
                            <input type="number" id="roomPrice" required min="0" placeholder="1000"
                                class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600 rounded-xl focus:border-indigo-500 outline-none transition">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Room Type *</label>
                            <select id="roomType" required
                                class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600 rounded-xl focus:border-indigo-500 outline-none transition">
                                <option value="">Select Type</option>
                                <option value="Single">Single Room</option>
                                <option value="Shared">Shared Room</option>
                                <option value="Master">Master Bedroom</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Description</label>
                        <textarea id="roomDescription" rows="4"
                            placeholder="Describe your room, amenities, and what you're looking for in a roommate..."
                            class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600 rounded-xl focus:border-indigo-500 outline-none transition resize-none"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <label
                            class="flex items-center p-4 bg-gray-700/30 rounded-xl cursor-pointer hover:bg-gray-700/50 transition">
                            <input type="checkbox" id="roomFurnished"
                                class="w-5 h-5 rounded border-gray-600 text-indigo-500">
                            <span class="ml-3">Furnished</span>
                        </label>
                        <label
                            class="flex items-center p-4 bg-gray-700/30 rounded-xl cursor-pointer hover:bg-gray-700/50 transition">
                            <input type="checkbox" id="roomUtilities"
                                class="w-5 h-5 rounded border-gray-600 text-indigo-500">
                            <span class="ml-3">Utilities Included</span>
                        </label>
                        <label
                            class="flex items-center p-4 bg-gray-700/30 rounded-xl cursor-pointer hover:bg-gray-700/50 transition">
                            <input type="checkbox" id="roomParking"
                                class="w-5 h-5 rounded border-gray-600 text-indigo-500">
                            <span class="ml-3">Parking Available</span>
                        </label>
                        <label
                            class="flex items-center p-4 bg-gray-700/30 rounded-xl cursor-pointer hover:bg-gray-700/50 transition">
                            <input type="checkbox" id="roomLaundry"
                                class="w-5 h-5 rounded border-gray-600 text-indigo-500">
                            <span class="ml-3">Laundry</span>
                        </label>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Available From</label>
                        <input type="date" id="roomAvailable"
                            class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600 rounded-xl focus:border-indigo-500 outline-none transition">
                    </div>

                    <div class="flex gap-3 pt-4">
                        <button type="submit"
                            class="flex-1 px-4 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 rounded-xl font-medium transition">
                            Post Room
                        </button>
                        <button type="button" onclick="closeAddRoomModal()"
                            class="px-4 py-3 bg-gray-700/50 hover:bg-gray-700 border border-gray-600 rounded-xl font-medium transition">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Mobile Menu -->
    <div id="mobileMenu" class="fixed inset-0 bg-gray-900/95 z-50 lg:hidden hidden">
        <div class="p-6">
            <div class="flex items-center justify-between mb-8">
                <a href="/" class="flex items-center space-x-2">
                    <span class="text-2xl">🏠</span>
                    <span class="text-lg font-bold gradient-text">RoomMate Finder</span>
                </a>
                <button id="closeMobileMenu" class="text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <nav class="space-y-2">
                <a href="/dashboard.html"
                    class="flex items-center px-4 py-3 rounded-lg text-gray-400 hover:text-white hover:bg-gray-700/50">Dashboard</a>
                <a href="/matches.html"
                    class="flex items-center px-4 py-3 rounded-lg text-gray-400 hover:text-white hover:bg-gray-700/50">Matches</a>
                <a href="/rooms.html"
                    class="flex items-center px-4 py-3 rounded-lg bg-indigo-500/20 text-white">Rooms</a>
                <a href="/preferences.html"
                    class="flex items-center px-4 py-3 rounded-lg text-gray-400 hover:text-white hover:bg-gray-700/50">Preferences</a>
                <a href="/profile.html"
                    class="flex items-center px-4 py-3 rounded-lg text-gray-400 hover:text-white hover:bg-gray-700/50">Profile</a>
                <a href="/settings.html"
                    class="flex items-center px-4 py-3 rounded-lg text-gray-400 hover:text-white hover:bg-gray-700/50">Settings</a>
                <button onclick="handleLogout()"
                    class="flex items-center px-4 py-3 rounded-lg text-red-400 hover:bg-red-500/10 w-full">Logout</button>
            </nav>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        if (!localStorage.getItem('token')) {
            window.location.href = '/login.html';
        }

        document.getElementById('mobileMenuBtn').addEventListener('click', () => {
            document.getElementById('mobileMenu').classList.remove('hidden');
        });
        document.getElementById('closeMobileMenu').addEventListener('click', () => {
            document.getElementById('mobileMenu').classList.add('hidden');
        });

        function handleLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
        }

        let allRooms = [];
        let myRooms = [];

        function showTab(tab) {
            const browseTab = document.getElementById('tab-browse');
            const myRoomsTab = document.getElementById('tab-my-rooms');
            const browseContent = document.getElementById('browse-content');
            const myRoomsContent = document.getElementById('my-rooms-content');

            if (tab === 'browse') {
                browseTab.classList.remove('bg-gray-700/50', 'border-gray-600', 'border');
                browseTab.classList.add('bg-gradient-to-r', 'from-indigo-600', 'to-purple-600');
                myRoomsTab.classList.add('bg-gray-700/50', 'border-gray-600', 'border');
                myRoomsTab.classList.remove('bg-gradient-to-r', 'from-indigo-600', 'to-purple-600');
                browseContent.classList.remove('hidden');
                myRoomsContent.classList.add('hidden');
            } else {
                myRoomsTab.classList.remove('bg-gray-700/50', 'border-gray-600', 'border');
                myRoomsTab.classList.add('bg-gradient-to-r', 'from-indigo-600', 'to-purple-600');
                browseTab.classList.add('bg-gray-700/50', 'border-gray-600', 'border');
                browseTab.classList.remove('bg-gradient-to-r', 'from-indigo-600', 'to-purple-600');
                myRoomsContent.classList.remove('hidden');
                browseContent.classList.add('hidden');
                loadMyRooms();
            }
        }

        async function loadRooms() {
            const grid = document.getElementById('roomsGrid');
            const emptyState = document.getElementById('emptyRooms');

            try {
                const response = await api.getRooms();
                allRooms = Array.isArray(response) ? response : response.rooms || [];

                if (allRooms.length === 0) {
                    grid.innerHTML = '';
                    emptyState.classList.remove('hidden');
                    return;
                }

                emptyState.classList.add('hidden');
                renderRooms(allRooms, grid);
            } catch (error) {
                console.error('Error loading rooms:', error);
                // Show sample rooms for demo
                allRooms = getSampleRooms();
                renderRooms(allRooms, grid);
            }
        }

        function getSampleRooms() {
            return [
                {
                    id: 1,
                    title: 'Cozy Room in Downtown',
                    location: 'Manhattan, NYC',
                    price: 1200,
                    type: 'private',
                    description: 'Beautiful furnished private room with great views.',
                    furnished: true,
                    utilities_included: true
                },
                {
                    id: 2,
                    title: 'Shared Space Near Campus',
                    location: 'Brooklyn, NYC',
                    price: 800,
                    type: 'shared',
                    description: 'Perfect for students. Close to public transit.',
                    furnished: false,
                    utilities_included: false
                },
                {
                    id: 3,
                    title: 'Sunny Studio Apartment',
                    location: 'Queens, NYC',
                    price: 1500,
                    type: 'apartment',
                    description: 'Entire apartment with kitchen and bathroom.',
                    furnished: true,
                    utilities_included: true
                }
            ];
        }

        function renderRooms(rooms, container) {
            container.innerHTML = rooms.map(room => {
                const roomType = (room.room_type || room.type || 'shared').toLowerCase();
                const typeLabels = { 'single': 'Single Room', 'shared': 'Shared Room', 'master': 'Master Bedroom' };
                const typeColors = { 'single': 'bg-indigo-500/20 text-indigo-400', 'shared': 'bg-purple-500/20 text-purple-400', 'master': 'bg-pink-500/20 text-pink-400' };
                const amenities = room.amenities || [];
                const price = room.rent_price || room.price || 0;
                const roomId = room.room_id || room.id;

                return `
                    <div class="card-hover bg-gray-800/50 border border-gray-700/50 rounded-2xl overflow-hidden transition-all duration-300">
                        <div class="h-48 bg-gradient-to-br from-indigo-500/20 to-purple-500/20 flex items-center justify-center">
                            <span class="text-6xl">🏠</span>
                        </div>
                        <div class="p-5">
                            <div class="flex items-start justify-between mb-2">
                                <h4 class="font-bold text-lg">${room.title}</h4>
                                <span class="${typeColors[roomType] || 'bg-gray-500/20 text-gray-400'} px-2 py-1 rounded-lg text-xs">${typeLabels[roomType] || roomType}</span>
                            </div>
                            <p class="text-gray-400 text-sm mb-3">${room.location}</p>
                            <p class="text-gray-400 text-sm mb-4 line-clamp-2">${room.description || 'No description available'}</p>
                            
                            <div class="flex flex-wrap gap-2 mb-4">
                                ${amenities.map(a => `<span class="px-2 py-1 bg-gray-700/50 rounded text-xs">${a}</span>`).join('')}
                            </div>
                            
                            <div class="flex items-center justify-between">
                                <div>
                                    <span class="text-2xl font-bold text-green-400">$${price}</span>
                                    <span class="text-gray-500 text-sm">/month</span>
                                </div>
                                <button onclick="contactOwner(${roomId})" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-sm font-medium transition">
                                    Contact
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function loadMyRooms() {
            const grid = document.getElementById('myRoomsGrid');
            const emptyState = document.getElementById('emptyMyRooms');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            try {
                const response = await api.getUserRooms(user.user_id);
                myRooms = Array.isArray(response) ? response : response.rooms || [];

                if (myRooms.length === 0) {
                    grid.innerHTML = '';
                    emptyState.classList.remove('hidden');
                    return;
                }

                emptyState.classList.add('hidden');
                renderRooms(myRooms, grid);
            } catch (error) {
                console.error('Error loading my rooms:', error);
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
            }
        }

        function showAddRoomModal() {
            document.getElementById('addRoomModal').classList.remove('hidden');
        }

        function closeAddRoomModal() {
            document.getElementById('addRoomModal').classList.add('hidden');
            document.getElementById('addRoomForm').reset();
        }

        document.getElementById('addRoomForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Build amenities array based on checkboxes
            const amenities = [];
            if (document.getElementById('roomFurnished').checked) amenities.push('Furnished');
            if (document.getElementById('roomUtilities').checked) amenities.push('Utilities Included');
            if (document.getElementById('roomParking').checked) amenities.push('Parking');
            if (document.getElementById('roomLaundry').checked) amenities.push('Laundry');

            const availableFrom = document.getElementById('roomAvailable').value;
            const roomData = {
                title: document.getElementById('roomTitle').value,
                location: document.getElementById('roomLocation').value,
                rent_price: parseInt(document.getElementById('roomPrice').value),
                room_type: document.getElementById('roomType').value,
                description: document.getElementById('roomDescription').value,
                amenities: amenities,
                images: ['placeholder.jpg']
            };
            if (availableFrom) roomData.available_from = availableFrom;

            try {
                await api.createRoom(roomData);
                alert('Room posted successfully!');
                closeAddRoomModal();
                loadRooms();
                loadMyRooms();
            } catch (error) {
                console.error('Error posting room:', error);
                alert('Failed to post room. Please try again.');
            }
        });

        async function contactOwner(roomId) {
            try {
                const room = await api.getRoom(roomId);
                const owner = room.owner;

                if (!owner) {
                    alert('Owner information not available');
                    return;
                }

                // Create and show contact modal
                const modal = document.createElement('div');
                modal.className = 'fixed inset-0 bg-black/70 flex items-center justify-center z-50';
                modal.id = 'contactModal';
                modal.innerHTML = `
                    <div class="bg-gray-800 rounded-2xl p-8 max-w-md w-full mx-4 border border-gray-700">
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-xl font-bold">Contact Owner</h3>
                            <button onclick="document.getElementById('contactModal').remove()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
                        </div>
                        
                        <div class="flex items-center gap-4 mb-6">
                            <div class="w-16 h-16 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-2xl font-bold">
                                ${(owner.full_name || 'O').charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <h4 class="font-semibold text-lg">${owner.full_name || 'Property Owner'}</h4>
                                <p class="text-gray-400 text-sm">Room: ${room.title}</p>
                            </div>
                        </div>
                        
                        <div class="space-y-4">
                            ${owner.phone ? `
                            <div class="flex items-center gap-3 p-4 bg-gray-700/50 rounded-xl">
                                <span class="text-2xl">📞</span>
                                <div>
                                    <p class="text-gray-400 text-sm">Phone</p>
                                    <a href="tel:${owner.phone}" class="text-indigo-400 hover:text-indigo-300 font-medium">${owner.phone}</a>
                                </div>
                            </div>
                            ` : ''}
                            
                            <div class="flex items-center gap-3 p-4 bg-gray-700/50 rounded-xl">
                                <span class="text-2xl">💰</span>
                                <div>
                                    <p class="text-gray-400 text-sm">Monthly Rent</p>
                                    <p class="text-green-400 font-bold">$${room.rent_price}/month</p>
                                </div>
                            </div>
                            
                            <div class="flex items-center gap-3 p-4 bg-gray-700/50 rounded-xl">
                                <span class="text-2xl">📍</span>
                                <div>
                                    <p class="text-gray-400 text-sm">Location</p>
                                    <p class="text-white">${room.location}</p>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-6 flex gap-3">
                            ${owner.phone ? `<a href="tel:${owner.phone}" class="flex-1 py-3 bg-green-600 hover:bg-green-500 rounded-xl text-center font-medium transition">Call Now</a>` : ''}
                            <button onclick="document.getElementById('contactModal').remove()" class="flex-1 py-3 bg-gray-700 hover:bg-gray-600 rounded-xl font-medium transition">Close</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);

                // Close on backdrop click
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) modal.remove();
                });

            } catch (error) {
                console.error('Error fetching room details:', error);
                alert('Failed to load contact information. Please try again.');
            }
        }

        // Combined filter function
        function applyFilters() {
            const query = document.getElementById('searchRooms').value.toLowerCase();
            const priceRange = document.getElementById('priceFilter').value;
            const roomType = document.getElementById('typeFilter').value;

            const filtered = allRooms.filter(room => {
                // Text search
                const matchesSearch = !query ||
                    room.title.toLowerCase().includes(query) ||
                    room.location.toLowerCase().includes(query);

                // Price filter
                let matchesPrice = true;
                if (priceRange) {
                    const price = room.rent_price || room.price || 0;
                    if (priceRange === '0-500') matchesPrice = price < 500;
                    else if (priceRange === '500-1000') matchesPrice = price >= 500 && price < 1000;
                    else if (priceRange === '1000-1500') matchesPrice = price >= 1000 && price < 1500;
                    else if (priceRange === '1500+') matchesPrice = price >= 1500;
                }

                // Type filter
                let matchesType = true;
                if (roomType) {
                    const type = (room.room_type || room.type || '').toLowerCase();
                    matchesType = type.includes(roomType);
                }

                return matchesSearch && matchesPrice && matchesType;
            });

            renderRooms(filtered, document.getElementById('roomsGrid'));
        }

        // Search filter
        document.getElementById('searchRooms').addEventListener('input', applyFilters);
        document.getElementById('priceFilter').addEventListener('change', applyFilters);
        document.getElementById('typeFilter').addEventListener('change', applyFilters);

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            document.getElementById('userAvatar').textContent = (user.full_name || 'U').charAt(0).toUpperCase();
            loadRooms();
        });

        // Close modal on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeAddRoomModal();
        });
    </script>
</body>

</html>
